#!/usr/sbin/nft -f
# kgate OpenWrt — nftables tproxy-редирект (traffic-path Phase 2).
#
# Назначение: заворачивать TCP/UDP-трафик LAN-клиентов на sing-box tproxy
# inbound (:7893). Гоняется ndm-shim'ом при deploy (KGATE_LAB=1 → честный
# degrade в state-маркер, см. шапку platform/openwrt/ndmc-shim).
#
# Требования: nftables, ip route (таблица 100 + ip rule), NET_ADMIN.
# Правила НЕ трогают dst в lab/lab-net подсетях — там форвард прямой.
#
# Семантика:
#   dst 10.90.0.10 ( FOREIGN-ресурс за туннелем) → tproxy → sing-box → hysteria2
#   dst 10.200.0.0/16 (lab-сегменты)             → НЕ трогаем (прямой форвард)
#
# В проде (реальный OpenWrt-роутер) 10.90.0.10 заменяется на набор
# «иностранных» CIDR/адресов (RU-split инверсия: что НЕ прямое — в туннель),
# а прямые подсети — на локальные сегменты и RU-CIDR через nft set'ы.

table ip kgate

# Удаление при повторном прогоне (идемпотентность) — ниже через chains,
# таблицу удаляем отдельно чтобы flush всех chains одной командой

delete table ip kgate

table ip kgate {
  # TCP/UDP от LAN-клиентов на foreign-адреса → tproxy сокет sing-box (:7893)
  # + метка 1 до routing decision (ip rule fwmark 1 → table 100 → local)
  chain prerouting {
    type filter hook prerouting priority mangle; policy accept;

    # исключение: локальные сегменты — прямым форвардом (без туннеля)
    ip daddr 10.200.0.0/16 return
    # исключение: RU-CIDR (заготовка под RU-split; в лабе пусто)
    ip daddr 192.168.0.0/16 return

    # туннелируемый трафик: TCP 80/443 + UDP 443 (HTTP/HTTPS/QUIC)
    iifname != "lo" ip daddr != 10.200.0.0/16 tcp dport {80, 443} meta mark set 1
    iifname != "lo" ip daddr != 10.200.0.0/16 udp dport 443 meta mark set 1
    meta mark 1 meta l4proto tcp tproxy ip to :7893 accept
    meta mark 1 meta l4proto udp tproxy ip to :7893 accept
  }
}
