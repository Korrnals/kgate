<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="KGATE — Home VPN Gateway Supervisor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#c3d3ea"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16233c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.45"/>

  <!-- правая зона: туннельные арки, центр (985,150) -->
  <g fill="none" stroke="url(#accent)">
    <ellipse cx="985" cy="150" rx="150" ry="84" stroke-width="3"   opacity="0.80"/>
    <ellipse cx="985" cy="150" rx="106" ry="60" stroke-width="3"   opacity="0.62"/>
    <ellipse cx="985" cy="150" rx="66"  ry="38" stroke-width="3"   opacity="0.46"/>
    <ellipse cx="985" cy="150" rx="32"  ry="19" stroke-width="3"   opacity="0.32"/>
  </g>
  <circle cx="985" cy="150" r="7" fill="#4fc3f7"/>
  <!-- «пакеты» на арках -->
  <circle cx="878" cy="108" r="4" fill="#7c8cff" opacity="0.9"/>
  <circle cx="1092" cy="192" r="4" fill="#4fc3f7" opacity="0.9"/>

  <!-- левая зона: щит, центр (100,150) -->
  <g transform="translate(45,80)">
    <path d="M55 0 L104 20 V78 C104 108 82 128 55 140 C28 128 6 108 6 78 V20 Z"
          fill="#0e1830" stroke="url(#accent)" stroke-width="4"/>
    <path d="M40 62 v-12 a15 15 0 0 1 30 0 v12" fill="none" stroke="#4fc3f7" stroke-width="5"/>
    <rect x="34" y="62" width="42" height="34" rx="6" fill="none" stroke="#7c8cff" stroke-width="5"/>
    <circle cx="55" cy="76" r="5" fill="#4fc3f7"/>
    <line x1="55" y1="80" x2="55" y2="90" stroke="#4fc3f7" stroke-width="4"/>
  </g>

  <!-- центральная зона: текст, центр x=485 -->
  <text x="485" y="136" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="88" font-weight="800" letter-spacing="12"
        fill="url(#title)">KGATE</text>
  <rect x="285" y="158" width="400" height="4" fill="url(#accent)"/>
  <text x="485" y="198" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="600" fill="#a9bcdc">Home VPN Gateway Supervisor</text>

  <!-- бейджи: ряд центрирован относительно x=485 -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(203,226)">
      <rect width="170" height="30" rx="15" fill="#122240" stroke="#26395c"/>
      <text x="85" y="20" text-anchor="middle" fill="#9fc0e8">supervisor</text>
    </g>
    <g transform="translate(400,226)">
      <rect width="170" height="30" rx="15" fill="#122240" stroke="#26395c"/>
      <text x="85" y="20" text-anchor="middle" fill="#9fc0e8">mTLS API</text>
    </g>
    <g transform="translate(597,226)">
      <rect width="170" height="30" rx="15" fill="#122240" stroke="#26395c"/>
      <text x="85" y="20" text-anchor="middle" fill="#9fc0e8">Entware .ipk</text>
    </g>
  </g>
</svg>
